[project]
name = "trading-system"
version = "0.1.0"
description = "Professional algorithmic trading research and execution platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alpaca-py>=0.42.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
